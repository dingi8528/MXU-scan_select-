name: MXU 编辑器入口实机验收构建

on:
  push:
    branches: [codex/editor-entry-validation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mxu-editor-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-x86_64-editor-${{ matrix.profile }}
          cache-on-failure: true
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 检查本地链接与目录回退
        run: node --test tests/localContentLink.test.mjs tests/fileDialogPath.test.mjs
      - name: 构建完整 Windows 客户端
        shell: pwsh
        run: |
          $taskBuildArgs = @('tauri', 'build', '--no-bundle', '--target', 'x86_64-pc-windows-msvc')
          if ('${{ matrix.profile }}' -eq 'debug') { $taskBuildArgs += '--debug' }
          pnpm @taskBuildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 校验并保存真实可执行文件
        shell: pwsh
        run: |
          $taskExe = 'src-tauri/target/x86_64-pc-windows-msvc/${{ matrix.profile }}/mxu.exe'
          if (!(Test-Path -LiteralPath $taskExe -PathType Leaf)) { throw 'MXU.exe missing' }
          New-Item -ItemType Directory -Path install -Force | Out-Null
          Copy-Item -LiteralPath $taskExe -Destination install/mxu.exe
          $taskHash = (Get-FileHash -LiteralPath install/mxu.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @{
            commit = '${{ github.sha }}'
            profile = '${{ matrix.profile }}'
            target = 'x86_64-pc-windows-msvc'
            sha256 = $taskHash
            bytes = (Get-Item -LiteralPath install/mxu.exe).Length
          } | ConvertTo-Json | Set-Content -LiteralPath install/build-info.json -Encoding utf8
          Copy-Item -LiteralPath LICENSE -Destination install/LICENSE
      - uses: actions/upload-artifact@v6
        with:
          name: MXU-win-x86_64-editor-validation-${{ matrix.profile }}
          path: install
          if-no-files-found: error
